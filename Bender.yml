# Bender manifest

package:
  name: opope
  authors:
    - "Danilo Cammarata (dcammarata@iis.ee.ethz.ch)"

dependencies:
  cv32e40p          : { git: "https://github.com/pulp-platform/cv32e40p.git"          , rev: "pulpissimo-v4.1.0"                      }
  cv32e40x          : { git: "https://github.com/pulp-platform/cv32e40x.git"          , rev: "redmule-v1.0"                           }
  ibex              : { git: "https://github.com/pulp-platform/ibex.git"              , rev: pulpissimo-v6.1.2                        }
  hwpe-stream       : { git: "https://github.com/pulp-platform/hwpe-stream.git"       , version: 1.7                                  }
  hwpe-ctrl         : { git: "https://github.com/pulp-platform/hwpe-ctrl.git"         , rev: 0e95510c0f4d43452d21b7723d766ae92e45c101 } # branch: yt/task-interfaces
  hci               : { git: "https://github.com/pulp-platform/hci.git"               , rev: v2.1.2                                   }
  fpnew             : { git: "https://github.com/pulp-platform/cvfpu.git"             , rev: "pulp-v0.1.3"                            }
  common_cells      : { git: "https://github.com/pulp-platform/common_cells.git"      , version: 1.21.0                               }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.11                               }

sources:
  files:
  # OPE
    - rtl/ope_pkg.sv
    - rtl/accumulation_reg.sv
    - rtl/ope_sdotp.sv
    - rtl/ope_sdotp_wrapper.sv
    - rtl/ope_fma.sv
    - rtl/ope_ce.sv
    - rtl/ope_engine.sv
    - rtl/ope_tiler.sv
    - rtl/ope_ctrl.sv
    - rtl/ope_streamer.sv
    - rtl/ope_buffers.sv
    - rtl/ope_top.sv

    - target: opope_hwpe
      files:
        - rtl/ope_wrap.sv

    - target: opope_complex
      files:
        - rtl/ope_inst_decoder.sv

    - target: any(opope_test_complex, opope_test_hwpe)
      files:
        - target/sim/src/tb_dummy_memory.sv

    - target: opope_test_complex
      files:
        - target/sim/src/opope_complex_tb.sv

    - target: opope_test_hwpe
      files:
        - target/sim/src/opope_tb.sv

    - target: vsim
      files:
        - target/sim/src/opope_tb_wrap.sv