.base:
  artifacts:
    when: always
    expire_in: 1 week

stages:
  - init
  - build
  - test

# --- Stage: Init ---
# Sets up the Python environment and links necessary dependencies
init:
  stage: init
  script:
    # Method 1: Copy from Spatz's build directory (fastest)
    - |
      SPATZ_VERILATOR=$(find /scratch2/gitlabci/builds -path "*/github-mirror/spatz/install/verilator" -type d 2>/dev/null | head -1)
      if [ -n "$SPATZ_VERILATOR" ] && [ -f "$SPATZ_VERILATOR/bin/verilator" ]; then
        echo "Copying Verilator from Spatz build: $SPATZ_VERILATOR"
        mkdir -p install
        cp -r "$SPATZ_VERILATOR" install/
        echo "Verilator copied successfully"
      fi
    
    # Method 2: If that fails, copy from Memora cache
    - |
      if [ ! -f install/verilator/bin/verilator ]; then
        CACHE_VERILATOR=$(find /home/gitlabci/caches/memora -path "*/verilator/install/verilator" -type d 2>/dev/null | head -1)
        if [ -n "$CACHE_VERILATOR" ] && [ -f "$CACHE_VERILATOR/bin/verilator" ]; then
          echo "Copying Verilator from Memora cache: $CACHE_VERILATOR"
          mkdir -p install
          cp -r "$CACHE_VERILATOR" install/
          echo "Verilator copied successfully"
        fi
      fi
    
    # Verify it works and create symlink for your Makefile
    - |
      if [ -f install/verilator/bin/verilator ]; then
        mkdir -p vendor/install
        ln -sf $CI_PROJECT_DIR/install/verilator vendor/install/verilator
        export PATH=$PWD/vendor/install/verilator/bin:$PATH
        verilator --version
      else
        echo "ERROR: Could not find Verilator anywhere"
        exit 1
      fi
    
    # Continue with your normal setup
    - make bender
    - which riscv32-unknown-elf-gcc

    # Fix pip to not use --user
    - export PIP_USER=false
    
    # Now run the setup script
    - source scripts/setup-py.sh
    
    # Verify the venv works
    - source golden-model/venv/bin/activate
    - python -c "import numpy; print('NumPy version:', numpy.__version__)"
    - python -c "import torch; print('PyTorch version:', torch.__version__)"
  artifacts:
    paths:
      - ./golden-model/venv
      - ./vendor
      - ./install

# --- Stage: Build ---
# Compiles the hardware (RTL) so it doesn't have to be rebuilt for every test
.opope-build-tpl:
  extends: .base
  stage: build
  dependencies:
    - init
  script:
    - export PATH=$PWD/install/verilator/bin:$PATH
    - which riscv32-unknown-elf-gcc
    - make synth-ips target=verilator
    - make hw-build target=verilator
  artifacts:
    paths:
      - ./.bender
      - ./scripts/synth_compile.tcl
      - ./target/sim/verilator/*

opope-build-hwpe:
  extends: .opope-build-tpl
  variables:
    SETUP_CONFIG: "setup-hwpe"

# --- Stage: Test ---
# Runs simulation across a matrix of parameters
.opope-sim-tpl:
  extends: .base
  stage: test
  script:
    - export PATH=$PWD/install/verilator/bin:$PATH
    - which riscv32-unknown-elf-gcc
    # Generate golden model reference
    - make golden OP=${OP} M=${M} N=${N} K=${K} fp_fmt=${FMT}
    # Build the software with specific flags if complex mode is needed
    - make sw-clean sw-build OPOPE_COMPLEX=${COMPLEX_MODE}
    # Run the simulation (hw-run target from your Makefile)
    - make hw-run target=verilator &> ./target/sim/verilator/transcript
    # Validation: Look for "Success!" in the simulation transcript
    - 'grep -rn "Success!" ./target/sim/verilator/transcript'
    - '! grep -rn "Fail!" ./target/sim/verilator/transcript'

# Example for a hwpe-specific test suite
hwpe-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "0"
  parallel:
    matrix:
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP16 }
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP8FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP8FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP8FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP8FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP8FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP8FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP8FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP8FP16 }

# Example for a complex-specific test suite
complex-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "0"
  parallel:
    matrix:
      - { OP: gemm, M: 8, N: 8, K: 8, FMT: FP16 }