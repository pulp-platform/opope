.base:
  artifacts:
    when: always
    expire_in: 1 week

.opope-env:
  before_script:
    - export GCC_ROOT="$(dirname "$(dirname "$(which riscv32-unknown-elf-gcc)")")"
    - export INSTALL_DIR="$CI_PROJECT_DIR/install"
    - export TRANSCRIPT="$CI_PROJECT_DIR/target/sim/verilator/transcript"
    - export PATH="$CI_PROJECT_DIR/install/cargo/bin:$PATH"

stages:
  - init
  - build
  - test

# --- Stage: Init ---
init:
  stage: init
  extends:
    - .base
    - .opope-env
  script:
    # Sanitize PATH: prevent cross-compiler from polluting host builds
    - export PATH=$(echo $PATH | tr ':' '\n' | grep -v riscv | tr '\n' ':')

    # Restore Verilator from Memora cache or build from source
    - |
      if ! memora get verilator; then
        echo "Cache miss — building Verilator from source"
        make verilator InstallDir=$INSTALL_DIR || true
        cat $CI_PROJECT_DIR/target/sim/toolchain/help2man/help2man-1.49.3/config.log || true
        memora put verilator
      fi

    - |
      if ! memora get bender; then
        echo "Cache miss — building Bender from source"
        make bender InstallDir=$INSTALL_DIR
        memora put bender
      fi

    # Propagate Verilator to vendor path (expected by downstream jobs)
    - mkdir -p vendor/install
    - cp -r $INSTALL_DIR/verilator vendor/install/verilator

    # Verify
    - export PATH=$INSTALL_DIR/verilator/bin:$PATH
    - verilator --version
    - $INSTALL_DIR/cargo/bin/bender --version

    # Python deps
    - python3.6 -m pip install --user numpy torch

  artifacts:
    paths:
      - ./vendor
      - ./install

# --- Stage: Build ---
.opope-build-tpl:
  extends:
    - .base
    - .opope-env
  stage: build
  dependencies:
    - init
  script:
    - make synth-ips target=verilator InstallDir=${INSTALL_DIR}
    - make hw-build target=verilator InstallDir=${INSTALL_DIR}
  artifacts:
    paths:
      - ./.bender
      - ./scripts/synth_compile.tcl
      - ./target/sim/verilator/*

opope-build-hwpe:
  extends: .opope-build-tpl
  variables:

# --- Stage: Test ---
.opope-sim-tpl:
  extends:
    - .base
    - .opope-env
  stage: test
  dependencies:
    - init
  script:
    - make golden OP=${OP} M=${M} N=${N} K=${K} fp_fmt=${FMT} PYTHON=python3.6
    - make sw-all OPOPE_COMPLEX=${COMPLEX_MODE} GccInstallDir=${GCC_ROOT}
    - make hw-run target=verilator InstallDir=${INSTALL_DIR} 2>&1 | tee ${TRANSCRIPT}
    - grep -q "Success!" ${TRANSCRIPT}
    - if grep -q "Fail!" ${TRANSCRIPT}; then exit 1; fi

# Example for hwpe-specific test suite
hwpe-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "0"
  parallel:
    matrix:
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP16 }
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP8FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP8FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP8FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP8FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP8FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP8FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP8FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP8FP16 }

# Complex test suite
complex-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "0"
  parallel:
    matrix:
      - { OP: gemm, M: 8, N: 8, K: 8, FMT: FP16 }