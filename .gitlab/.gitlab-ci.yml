.base:
  artifacts:
    when: always
    expire_in: 1 week

stages:
  - init
  - build
  - test

# --- Stage: Init ---
init:
  stage: init
  script:
    # Copy Verilator from Spatz's build directory
    - SPATZ_VERILATOR=$(find /scratch2/gitlabci/builds -path "*/github-mirror/spatz/install/verilator" -type d 2>/dev/null | head -1) || true
    - |
      if [ -n "$SPATZ_VERILATOR" ] && [ -f "$SPATZ_VERILATOR/bin/verilator" ]; then
        echo "Copying Verilator from Spatz build: $SPATZ_VERILATOR"
        mkdir -p install vendor/install
        cp -r "$SPATZ_VERILATOR" install/
        cp -r "$SPATZ_VERILATOR" vendor/install/
        echo "Verilator copied successfully"
      fi
    
    # Method 2: If that fails, copy from Memora cache
    - CACHE_VERILATOR=$(find /home/gitlabci/caches/memora -path "*/verilator/install/verilator" -type d 2>/dev/null | head -1) || true
    - |
      if [ ! -f install/verilator/bin/verilator ] && [ -n "$CACHE_VERILATOR" ] && [ -f "$CACHE_VERILATOR/bin/verilator" ]; then
        echo "Copying Verilator from Memora cache: $CACHE_VERILATOR"
        mkdir -p install vendor/install
        cp -r "$CACHE_VERILATOR" install/
        cp -r "$CACHE_VERILATOR" vendor/install/
        echo "Verilator copied successfully"
      fi
    
    # Verify it works
    - |
      if [ -f vendor/install/verilator/bin/verilator ]; then
        export PATH=$PWD/vendor/install/verilator/bin:$PATH
        verilator --version
      else
        echo "ERROR: Could not find Verilator"
        exit 1
      fi
    
    # Build bender and other tools
    - make bender InstallDir=./install
    - which riscv32-unknown-elf-gcc
    
    # NO Python venv setup here anymore
  artifacts:
    paths:
      - ./vendor
      - ./install

# --- Stage: Build ---
.opope-build-tpl:
  extends: .base
  stage: build
  dependencies:
    - init
  script:
    # Setup Verilator path
    - export PATH=$CI_PROJECT_DIR/install/verilator/bin:$PATH
    - verilator --version
    - which riscv32-unknown-elf-gcc
    
    # Build hardware
    - make synth-ips target=verilator InstallDir=$CI_PROJECT_DIR/install
    - make hw-build target=verilator InstallDir=$CI_PROJECT_DIR/install
  artifacts:
    paths:
      - ./.bender
      - ./scripts/synth_compile.tcl
      - ./target/sim/verilator/*

opope-build-hwpe:
  extends: .opope-build-tpl
  variables:

# --- Stage: Test ---
.opope-sim-tpl:
  extends: .base
  stage: test
  before_script:
    - which python3
    - python3 --version
    - python3 -c "import sys; print('\n'.join(sys.path))"
    - python3 -c "import site; print(site.getsitepackages())"
    - strings /lib64/libstdc++.so.6 | grep GLIBCXX | tail
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install numpy
    - pip install torch --index-url https://download.pytorch.org/whl/cpu

    - python -c "import numpy; print(numpy.__file__)"
    - python -c "import torch; print(torch.__version__)"
  script:
    # Setup Verilator path
    - export PATH=$CI_PROJECT_DIR/install/verilator/bin:$PATH
    - verilator --version
    - which riscv32-unknown-elf-gcc
    
    # Generate golden model reference (no venv needed)
    - make golden OP=${OP} M=${M} N=${N} K=${K} fp_fmt=${FMT}
    
    # Build the software
    - make sw-clean sw-build OPOPE_COMPLEX=${COMPLEX_MODE}
    
    # Run the simulation
    - make hw-run target=verilator InstallDir=$CI_PROJECT_DIR/install 2>&1 | tee ./target/sim/verilator/transcript
    
    # Validation
    - grep -q "Success!" ./target/sim/verilator/transcript
    - if grep -q "Fail!" ./target/sim/verilator/transcript; then exit 1; fi

# Example for hwpe-specific test suite
hwpe-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "0"
  parallel:
    matrix:
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP16 }
      - { OP: gemm, M: 16, N: 64, K: 32, FMT: FP8FP16 }
      - { OP: gemm, M: 32, N: 96, K: 18, FMT: FP8FP16 }
      - { OP: gemm, M: 64, N: 53, K: 16, FMT: FP8FP16 }
      - { OP: gemm, M: 96, N: 21, K: 45, FMT: FP8FP16 }
      - { OP: gemm, M: 57, N: 16, K: 64, FMT: FP8FP16 }
      - { OP: gemm, M: 15, N: 32, K: 71, FMT: FP8FP16 }
      - { OP: gemm, M: 37, N: 47, K: 96, FMT: FP8FP16 }
      - { OP: gemm, M: 41, N: 63, K: 13, FMT: FP8FP16 }

# Complex test suite
complex-test:
  extends: .opope-sim-tpl
  dependencies:
    - opope-build-hwpe
  variables:
    COMPLEX_MODE: "1"
  parallel:
    matrix:
      - { OP: gemm, M: 8, N: 8, K: 8, FMT: FP16 }